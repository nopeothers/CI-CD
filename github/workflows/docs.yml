name: Generate Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pdoc
      run: pip install pdoc
    - name: Generate HTML documentation
      run: pdoc src/calculator.py -o docs/
    - name: Commit and push docs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate documentation [skip ci]"
        git push
